[package]
name = "market_data_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "market_data_core"
crate-type = ["staticlib"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
once_cell = "1"

[profile.release]
panic = "unwind"
lto = true
codegen-units = 1
